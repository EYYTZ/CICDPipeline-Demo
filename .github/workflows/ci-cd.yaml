# 這是我們 Workflow 的名稱，會顯示在 GitHub Actions 的面板上
name: Full-Stack CI/CD Pipeline

# 【介面隔離原則 (ISP)】
# 定義何時要觸發這個 Workflow。我們不希望任何風吹草動都跑完整個流程。
on:
  push:
    # 只有推送到 main 分支時才觸發
    branches: [ "main" ]
    # 如果只是改了 README 或文件，不要浪費 CI 資源去跑測試
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]

# 定義流程中的各項工作 (Jobs)
jobs:
  # ==========================================
  # 階段 1: CI (Continuous Integration) 測試與檢查
  # ==========================================
  integration:
    # 【單一職責原則 (SRP)】: 這個 Job 只負責檢查程式碼品質與測試
    name: Code Quality and Testing
    # 指定執行的虛擬機環境 (Ubuntu 是最常用且便宜的選擇)
    runs-on: ubuntu-latest

    steps:
      # Step 1: 把你的程式碼拉到這台虛擬機裡面
      # uses 代表使用 GitHub 官方或社群寫好的腳本 (Actions)
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: 設定執行環境 (這裡替換為 Python 環境)
      # 【依賴反轉原則 (DIP)】: 不依賴系統預設環境，明確指定我們需要的版本
      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # 若未來有 requirements.txt，可以加上 cache: 'pip' 加速執行

      # Step 3: 安裝專案依賴套件
      - name: 📦 Install Dependencies
        # 升級 pip。由於目前 CICDTest.py 只用內建 unittest，所以不需額外安裝套件
        run: python -m pip install --upgrade pip

      # Step 4: 執行程式碼風格檢查 (Lint)
      - name: 🔍 Run Linter (Syntax Check)
        run: python -m py_compile app.py CICDTest.py

      # Step 5: 執行自動化測試
      # 如果這個步驟失敗，整個 Pipeline 就會停止，防止壞代碼進入下一個階段
      - name: 🧪 Run Unit Tests
        run: python -m unittest CICDTest.py

  # ==========================================
  # 階段 2: CD (Continuous Deployment) 打包與佈署
  # ==========================================
  deployment:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # 【開放封閉原則 (OCP) & 單一職責】
    # needs 代表這個 Job "依賴" integration 這個 Job。
    # 只有當 integration (測試) 成功通過後，才會執行 deployment，這保護了我們的伺服器不被壞代碼污染。
    needs: integration
    # 只有在推送到 main 分支時才執行佈署 (Pull Request 不會觸發佈署)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # 【新增】給予 GITHUB_TOKEN 寫入 Packages (也就是 GHCR 映像檔) 的權限
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 1: 改為登入 GitHub 內建的 Container Registry (GHCR)
      # 這裡我們直接使用 GitHub 內建的帳號變數與自動發放的 Token，不需要手動設定！
      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: 建置 Docker Image 並推送到 GHCR
      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 將映像檔名稱改為 ghcr.io/你的帳號/你的專案名稱
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}, ghcr.io/${{ github.repository }}:latest

      # Step 3: 登入遠端伺服器進行佈署
      # ⚠️ 目前我們還沒有雲端伺服器，所以先將這段註解掉，專注於完成 Docker 打包與推送
      # - name: 🚀 Deploy to Production Server
